<!doctype html>
<html lang="id">
<head>
<meta name="viewport" content= "width=device-width, initial-scale=1">
<title>Happy Birth Day</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
    margin: 0; height: 100vh; background: pink;
    font-family: 'Dancing Script', cursive;
    display: flex; justify-content: center; align-items: center; overflow: hidden;
}

canvas {
    position: fixed; top:0; left: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events:none; 
}

.card {
    position: relative; z-index: 1;
    background: white; border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    max-width: 420px; width: 90%; min-height: 520px;
    display: flex; flex-direction: column; overflow: hidden;
    padding-bottom: 60px;  transform: translateY(-30px);
}

.slide {
    position:absolute; top: 0; left: 0; right: 0; bottom:0;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
}

.slide.active {opacity: 1; pointer-events: auto;}
.content {
    flex: 1; padding: 20px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; overflow-y: auto;
}

h1 {font-size: 28px; margin: 10px 0;}
p {font-size: 20px; color: #333;}
.pin-box {
    display: flex; gap:10px; justify-content: center; margin: 15px 0;
}

.pin-group:last-child {
    transform: translateX(0);
}

.pin-box input {
    box-sizing: border-box; width: 50px; height: 60px; font-size: 28px; text-align: center;
    border-radius: 10px; border: 2px solid #ff4d88;
}

.pin-dash {
    height: 60px; font-size: 50px; text-align: center;
}

.error {color: red; margin-top: 10px;}
.keyboard .row {display: flex; justify-content: center; margin: 5px 0;}
.keyboard button {
    width: 60px; height: 60px; margin: 5px; border: none; border-radius: 10px;
    font-size: 20px; background: red; color: white; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.2s;
}

.keyboard button:active {transform: scale(0.9); background: red;}
img {max-width:80%; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); margin: 15px 0;}
.btn {
    padding:10px 20px; border: none; border-radius: 10px;
    background: red; color: #fff; font-size: 18px; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.3s;
}

.btn:hover {background: red;}
.nav-btns {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 12px 20px; border-top: 1px solid #eee; background: #fff;
}

/* Slide animation */
@keyframes slideInRight { from {transform: translateX(100%); opacity: 0;} to {transform: translate(0); opacity:1;}}
@keyframes slideOutLeft { from {transform: translateX(0); opacity: 1;} to {transform: translate(-100%); opacity:0;}}
@keyframes slideInLeft { from {transform: translateX(-100%); opacity: 0;} to {transform: translate(0); opacity:1;}}
@keyframes slideOutRight { from {transform: translateX(0); opacity: 1;} to {transform: translate(100%); opacity:0;}}
.slide-in-right {animation: slideInRight 0.6s forwards;}
.slide-out-left {animation: slideOutLeft 0.6s forwards;}
.slide-in-left {animation: slideInLeft 0.6s forwards;}
.slide-out-right {animation: slideOutRight 0.6s forwards;}

/* tombol musik */
#musicToggle {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    padding: 10px 20px; border: none; border-radius: 10px;
    background :red; color: #fff; font-size: 16px; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.3s; z-index: 10;
}

#musicToggle:hover {background: red;}
</style>
</head>
<body>

<canvas id="canvas">/</canvas>

<div class="card">
    <!--slide 1-->
    <div class="slide active" id="slide1">
        <div class="content">
            <h1>Masukkan Password</h1>
            <div class="pin-box">
                <div class="pin-group">
                    <input type="password" maxlength="1" onkeydown="return false";>
                    <input type="password" maxlength="1" onkeydown="return false";>
                </div>
                <span class="pin-dash">/</span>
                <div class="pin-group">
                    <input type="password" maxlength="1" onkeydown="return false";>
                    <input type="password" maxlength="1" onkeydown="return false";>
                </div>
            </div>
            <div class="keyboard">
                <div class="row">
                    <button onclick="pressNum(1)">1</button>
                    <button onclick="pressNum(2)">2</button>
                    <button onclick="pressNum(3)">3</button>
                </div>
                <div class="row">
                    <button onclick="pressNum(4)">4</button>
                    <button onclick="pressNum(5)">5</button>
                    <button onclick="pressNum(6)">6</button>
                </div>
                <div class="row">
                    <button onclick="pressNum(7)">7</button>
                    <button onclick="pressNum(8)">8</button>
                    <button onclick="pressNum(9)">9</button>
                </div>
                <div class="row">
                    <button onclick="deleteNum()">⌫</button>
                    <button onclick="pressNum(0)">0</button>
                    <button onclick="checkPin()">✔</button>
                </div>
            </div>
            <div class="error" id="errorMsg"></div>
            <p style="margin-top: 12px; font-size: 16px; color: #555;"><i>* Clue: tanggal dan bulan lahirmu</i></p>
        </div>
    </div>

    <!--slide 2-->
    <div class="slide" id="slide2">
        <div class="content">
            <h1>Selamat Ulang Tahun 🎉</h1>
            <img src="birthday2.gif" alt="Happy Birthday"> 
            <p></p>
        </div>
        <div class="nav-btns" style="justify-content: center;">
            <button class="btn" onclick="nextSlide()">Lanjut ➡</button>
        </div>
    </div>

    <!--slide 3-->
    <div class="slide" id="slide3">
        <div class="content">
            <h1>doa dan harapan</h1>
            <img src="hope.gif" alt="Doa dan Harapan">
            <p>Sehat selalu, menjadi pribadi yang lebih baik dari tahun sebelumnya, dan harus Full senyum</p>
        </div>
        <div class="nav-btns">
            <button class="btn" onclick="prevSlide()">⬅ Kembali</button>
            <button class="btn" onclick="nextSlide()">Lanjut ➡</button>
        </div>
    </div>

    <!--slide 4-->
    <div class="slide" id="slide4">
        <div class="content">
            <img src="think.gif" alt="Foto">
            <p>Sekarang sudah umur berapa ya...🤔🧐</p>
        </div>
        <div class="nav-btns">
            <button class="btn" onclick="prevSlide()">⬅ Kembali</button>
            <button class="btn" onclick="nextSlide()">Lanjut ➡</button>
        </div>
    </div>

    <!--slide 5-->
    <div class="slide" id="slide5">
        <div class="content">
            <img src="bow.gif" alt="Terima Kasih">
            <p>Sekian Terima Kasih</p>
        </div>
        <div class="nav-btns" style="justify-content: center;">
            <button class="btn" onclick="prevSlide()">⬅ Kembali</button>
        </div>
    </div>
</div>

<!-- tombol musik -->
<button id="musicToggle" onclick="toggleMusic()">▶ Play Music</button>

<script>
let currentSlide=1;
const slides=document.querySelectorAll('.slide');
function animateSlides(oldIndex, newIndex){
    const oldSlide=slides[oldIndex-1];
    const newSlide=slides[newIndex-1];
    slides.forEach(s=>s.classList.remove("slide-in-right","slide-out-left","slide-in-left","slide-out-right","active"));
    if(newIndex>oldIndex){
        oldSlide.classList.add("slide-out-left");
        newSlide.classList.add("slide-in-right");
    } else {
        oldSlide.classList.add("slide-out-right");
        newSlide.classList.add("slide-in-left");
    }
    newSlide.classList.add("active");
    currentSlide=newIndex;
}
function checkPin(){
    const inputs=document.querySelectorAll('#slide1 input');
    const pin=[...inputs].map(i=>i.value).join('');
    if(pin==="1810"){
        animateSlides(1, 2);
        document.getElementById('errorMsg').innerText="";
    } else if (pin==="2107"){
        document.getElementById('errorMsg').innerText="itu tanggal dan bulan lahirku";
        inputs.forEach(i=>i.value="");
    } else {
        document.getElementById('errorMsg').innerText="Pin salah, coba lagi";
        inputs.forEach(i=>i.value="");
    } 
}
function nextSlide(){if(currentSlide<5) animateSlides(currentSlide, currentSlide+1);}
function prevSlide(){if(currentSlide>2) animateSlides(currentSlide, currentSlide-1);}
function pressNum(num){
    const inputs=document.querySelectorAll('#slide1 input');
    for(let i=0;i<inputs.length;i++){if(inputs[i].value===""){inputs[i].value=num; break;}}
}
function deleteNum(){
    const inputs=document.querySelectorAll('#slide1 input');
    for(let i=inputs.length-1;i>=0;i--){if(inputs[i].value!==""){inputs[i].value=""; break;}}
}

// Musik
let audio=new Audio("music.mp3"); audio.loop=true;
let isPlaying=false;
function toggleMusic(){
    if(isPlaying){audio.pause(); isPlaying=false; document.getElementById('musicToggle').innerText="▶ Play Musik";}
    else{audio.play(); isPlaying=true; document.getElementById('musicToggle').innerText="⏸ Stop Musik";}
}

//partikel
const canvas=document.getElementById("canvas"); const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth; canvas.height=window.innerHeight;
class Heart{constructor(){this.x=Math.random()*canvas.width; this.y=canvas.height+Math.random()*100; this.size=10+Math.random()*20; this.speed=0.5+Math.random()*1.5; this.alpha=0.5+Math.random()*0.5; this.color="rgba(255,0,100,"+this.alpha+")";}draw(){ctx.save(); ctx.translate(this.x,this.y); ctx.fillStyle=this.color; ctx.beginPath(); ctx.moveTo(0, -this.size/2); ctx.bezierCurveTo(this.size/2,-this.size,this.size,-this.size/4,0,this.size);ctx.bezierCurveTo(-this.size,-this.size/4,this.size/2,-this.size,0,-this.size/2);ctx.closePath();ctx.fill();ctx.restore();}update(){this.y-=this.speed;if(this.y<-50){this.y=canvas.height+50;this.x=Math.random()*canvas.width;}this.draw();}}
let hearts=[]; for(let i=0;i<40;i++){hearts.push(new Heart());}
function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);hearts.forEach(h=>h.update()); requestAnimationFrame(animate);}
animate(); window.addEventListener("resize",()=>{canvas.width=window.innerWidth; canvas.height=window.innerHeight;});
</script>

</body>
</html>
